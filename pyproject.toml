[project]
name = "finrag"
version = "0.1.0"
description = "FinRAG - 面向金融企业三大场景（数据字典 / 智能问数 / 文档知识库）的生产级 RAG 平台"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=42.0",
    "qdrant-client>=1.9",
    "celery>=5.3",
    "redis>=5.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.2,<0.4",
    "langgraph>=0.2",
    "ragas>=0.2,<0.4",
    "sqlglot>=25.0",
    "jieba>=0.42",
    "mcp>=1.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
embedding = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]
rerank = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
dev = [
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入的标准写法：Depends()/Query()/Body() 等在默认参数中调用
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
]
